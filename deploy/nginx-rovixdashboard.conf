# Nginx reverse proxy for the Rovix Uptime Monitoring dashboard.
#
# Deliberately does NOT alias /assets/ to a static directory (the generic
# audit report suggested this). auth.py's require_login gate covers every
# route except /login, /logout, /api/*, and /push/* -- that includes
# /assets/. Serving /assets/ as a static alias would bypass that gate
# entirely, so an unauthenticated request could pull every uploaded client
# logo (assets/logos/*.png) and the dashboard's CSS straight off disk.
# Everything proxies through gunicorn so the login check always runs.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # <- replace

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
